<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face {
    font-family: 'Martian Mono';
    font-style: normal;
    font-weight: 800;
    src: url('../fonts/martian-mono-800.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Spline Sans Mono';
    font-style: normal;
    font-weight: 400;
    src: url('../fonts/spline-sans-mono-400.woff2') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #050302;
    overflow: hidden;
    position: relative;
    font-family: 'Spline Sans Mono', monospace;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 85% 60% at 50% 118%, rgba(255, 90, 0, 0.22), transparent 70%),
      radial-gradient(ellipse 50% 35% at 50% 122%, rgba(255, 140, 40, 0.16), transparent 70%);
  }
  .scan {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,140,60,.03) 0 1px, transparent 1px 3px);
  }
  .box {
    position: absolute;
    left: 90px; top: 118px;
  }
  svg { width: 150px; height: 150px; stroke: #ff6a00; }
  h1 {
    font-family: 'Martian Mono', monospace;
    font-weight: 800;
    font-size: 64px;
    line-height: 1.14;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: #ffd9ad;
    text-shadow: 0 0 40px rgba(255, 106, 0, 0.3);
    margin-top: 46px;
  }
  h1 .hot { color: #ff6a00; }
  p {
    margin-top: 30px;
    font-size: 23px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #a06b3f;
  }
  p b { color: #ff6a00; font-weight: 400; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="scan"></div>
  <div class="box">
    <svg viewBox="30 30 452 452" fill="none" stroke-width="22">
      <line x1="219.63" y1="103.79" x2="142.37" y2="148.4"/>
      <line x1="292.37" y1="103.79" x2="369.63" y2="148.4"/>
      <line x1="142.37" y1="190.4" x2="219.63" y2="235"/>
      <line x1="369.63" y1="190.4" x2="292.37" y2="235"/>
      <line x1="219.63" y1="277" x2="142.37" y2="321.6"/>
      <line x1="292.37" y1="277" x2="369.63" y2="321.6"/>
      <line x1="142.37" y1="363.6" x2="219.63" y2="408.21"/>
      <line x1="369.63" y1="363.6" x2="292.37" y2="408.21"/>
      <circle cx="256" cy="82.79" r="44" fill="#ff6a00" stroke="none"/>
      <circle cx="106" cy="169.4" r="44" fill="#ff6a00" stroke="none"/>
      <circle cx="406" cy="169.4" r="44" fill="#ff6a00" stroke="none"/>
      <circle cx="256" cy="256" r="44" fill="#ff6a00" stroke="none"/>
      <circle cx="106" cy="342.6" r="44" fill="#ff6a00" stroke="none"/>
      <circle cx="406" cy="342.6" r="44" fill="#ff6a00" stroke="none"/>
      <circle cx="256" cy="429.21" r="44" fill="#ff6a00" stroke="none"/>
    </svg>
    <h1>Accelerate peer-to-peer<br /><span class="hot">social media</span></h1>
    <p><b>◆</b> Bitsocial Forge Inc.</p>
  </div>
</body>
</html>
